# TF-M non-secure side, bare metal (no RTOS), same profile as the secure image
CONFIG_MCUX_COMPONENT_middleware.tfm.ns=y
CONFIG_MCUX_COMPONENT_middleware.tfm.profile_large=y
CONFIG_MCUX_COMPONENT_middleware.tfm.ns.os_wrapper.baremetal=y
CONFIG_MCUX_COMPONENT_device.startup=n
CONFIG_MCUX_COMPONENT_device.system=y
CONFIG_MCUX_PRJSEG_module.board.pinmux_board_folder=y
CONFIG_FLASH_BASE_ADDRESS=0x080A0000

# Ethernet: ENET, the board's KSZ8081 PHY, NXP's lwIP port (as in lwip_examples/lwip_dhcp/bm for this board)
CONFIG_MCUX_COMPONENT_driver.enet=y
CONFIG_MCUX_COMPONENT_component.phyksz8081=y
CONFIG_MCUX_COMPONENT_component.lpc_gpio_adapter=y
CONFIG_MCUX_COMPONENT_utility.assert=y
CONFIG_MCUX_COMPONENT_middleware.lwip=y
CONFIG_MCUX_COMPONENT_middleware.lwip.kinetis_ethernetif=y
CONFIG_MCUX_PRJSEG_middleware.lwip.generated_config=y

# lwIP: no OS, IPv4, DHCP, TCP; random numbers from TF-M's PSA RNG (hardware TRNG), not the port's fixed-seed LCG
CONFIG_LWIP_OPT_H_CODE_LINE_1="void sys_check_core_locking(void);"
CONFIG_LWIP_OPT_H_CODE_LINE_2="unsigned int aegis_rand32(void);"
CONFIG_NO_SYS=y
CONFIG_LWIP_NETCONN=n
CONFIG_LWIP_SOCKET=n
CONFIG_LWIP_ASSERT_CORE_LOCKED( )="sys_check_core_locking()"
CONFIG_MEM_ALIGNMENT=4
CONFIG_MEM_SIZE=32768
CONFIG_MEMP_NUM_PBUF=16
CONFIG_MEMP_NUM_UDP_PCB=4
CONFIG_MEMP_NUM_TCP_PCB=8
CONFIG_MEMP_NUM_TCP_PCB_LISTEN=2
CONFIG_MEMP_NUM_TCP_SEG=32
CONFIG_MEMP_NUM_SYS_TIMEOUT="10"
CONFIG_MEMP_NUM_REASSDATA=2
CONFIG_PBUF_POOL_SIZE=8
CONFIG_LWIP_TCP=y
CONFIG_TCP_TTL=255
CONFIG_TCP_QUEUE_OOSEQ=n
CONFIG_TCP_MSS=1460
CONFIG_TCP_SND_BUF="(8 * TCP_MSS)"
CONFIG_TCP_SND_QUEUELEN="((3 * TCP_SND_BUF) / TCP_MSS)"
CONFIG_TCP_WND="(4 * TCP_MSS)"
CONFIG_TCP_LISTEN_BACKLOG=y
CONFIG_LWIP_ICMP=y
CONFIG_LWIP_DHCP=y
CONFIG_LWIP_UDP=y
CONFIG_UDP_TTL=255
CONFIG_LWIP_STATS=n
CONFIG_LWIP_PROVIDE_ERRNO=y
CONFIG_LWIP_NETIF_EXT_STATUS_CALLBACK=y
CONFIG_IP_REASS_MAX_PBUFS=4
CONFIG_LWIP_SINGLE_NETIF=y

# our own hardware_init.c and app.h (src/), not the board port folder
CONFIG_MCUX_HAS_PRJSEG_project.use_hw_app=n

# the non-secure client of NXP loader service: not used (the secure partition is left out of aegis_s)
CONFIG_MCUX_COMPONENT_middleware.tfm.ns.loader_service=n
