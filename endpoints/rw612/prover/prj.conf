# SPDX-License-Identifier: Apache-2.0
# Aegis prover for the FRDM-RW612
CONFIG_ENTROPY_GENERATOR=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_PKT_RX_COUNT=48
CONFIG_NET_PKT_TX_COUNT=48
CONFIG_NET_BUF_RX_COUNT=96
CONFIG_NET_BUF_TX_COUNT=96
CONFIG_NET_MAX_CONTEXTS=24
# every closed connection keeps its context through TCP TIME_WAIT; the gateway opens several in a row
CONFIG_NET_MAX_CONN=24
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=16384
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="aegis-rw612"

CONFIG_LOG=y
CONFIG_NET_LOG=y
CONFIG_PRINTK=y
