# SPDX-License-Identifier: Apache-2.0
name: host-regression
on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y iverilog cmake ninja-build python3-venv python3-pip curl nftables iproute2 swtpm libtss2-dev pkg-config

      - name: Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q cryptography pytest requests pyyaml pillow pycryptodome tpm2-pytss
          # the standalone checkers' libraries (tools/verify_evidence.py, docs/evidence-format.md;
          # tools/verify_audit.py, docs/audit-and-policy.md); pycose
          # 1.1.0 does not work with cbor2 6. Without them its tests would be skipped, so their presence is checked.
          .venv/bin/pip install -q pycose==1.1.0 'cbor2<6'
          .venv/bin/python -c "import pycose, cbor2; from cryptography.hazmat.primitives.asymmetric import mldsa"

      - name: Cache liboqs 0.16.0
        id: liboqs
        uses: actions/cache@v4
        with:
          path: |
            ~/aegis-tools/liboqs-src
            ~/aegis-tools/liboqs
          key: liboqs-0.16.0-mlkem-mldsa-installed

      - name: Build liboqs 0.16.0 (ML-KEM and ML-DSA only)
        if: steps.liboqs.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/aegis-tools
          git clone -q --depth 1 --branch 0.16.0 https://github.com/open-quantum-safe/liboqs.git ~/aegis-tools/liboqs-src
          cmake -S ~/aegis-tools/liboqs-src -B ~/aegis-tools/liboqs-src/build -GNinja \
            -DCMAKE_INSTALL_PREFIX=$HOME/aegis-tools/liboqs -DBUILD_SHARED_LIBS=ON \
            -DOQS_MINIMAL_BUILD="KEM_ml_kem_512;KEM_ml_kem_768;KEM_ml_kem_1024;SIG_ml_dsa_44;SIG_ml_dsa_65;SIG_ml_dsa_87"
          ninja -C ~/aegis-tools/liboqs-src/build install

      - name: mldsa-native and mlkem-native v2.0.0 (for the Prover SDK, sdk/, built by tests/host/test_rw612_proto.py and others)
        run: |
          for r in mldsa-native mlkem-native; do
            [ -d ~/aegis-tools/$r ] || git clone -q --depth 1 --branch v2.0.0 https://github.com/pq-code-package/$r.git ~/aegis-tools/$r
          done

      - name: Fuzz the Prover SDK core, the one harness for every device family (libFuzzer, ASan, UBSan; seeds first, 2 minutes)
        run: |
          sudo apt-get install -y clang libclang-rt-18-dev
          FUZZ_OUT=$RUNNER_TEMP/fuzz tests/fuzz/run.sh 120 2 || { tail -n 60 $RUNNER_TEMP/fuzz/fuzz-*.log; exit 1; }

      - name: Fuzz the STM32H573 port of the SDK on PC stand-ins for TF-M (libFuzzer, ASan, UBSan; seeds first, 2 minutes)
        run: STM32=1 FUZZ_OUT=$RUNNER_TEMP/fuzz-stm32 tests/fuzz/run.sh 120 2 || { tail -n 60 $RUNNER_TEMP/fuzz-stm32/fuzz-*.log; exit 1; }

      - name: Fuzz the Prover SDK core with its option for standard evidence, EAT in COSE_Sign1 (libFuzzer, ASan, UBSan; seeds first, 2 minutes)
        run: EAT=1 FUZZ_OUT=$RUNNER_TEMP/fuzz-eat tests/fuzz/run.sh 120 2 || { tail -n 60 $RUNNER_TEMP/fuzz-eat/fuzz-*.log; exit 1; }

      - name: The ZynqMP OP-TEE port of the SDK on a stand-in for OP-TEE (gcc, ASan, UBSan)
        run: endpoints/zynqmp/optee/tests/run.sh

      - name: NIST ACVP vectors (checked against SHA256SUMS)
        run: |
          tools/fetch_acvp.sh
          mkdir -p build/acvp
          .venv/bin/python tools/acvp_commands.py "$PWD/build/acvp/commands.jsonl"

      - name: Release hygiene (SPDX lines, no secrets) and the Prover SDK's API reference against its header
        run: |
          .venv/bin/python tools/check_release.py
          .venv/bin/python tools/gen_sdk_api_ref.py --check

      - name: The Prover SDK as a device maker builds it, and the simulated device attested end to end (sdk/examples/simulated-device)
        run: |
          KEEP=1 sdk/examples/simulated-device/run.sh $RUNNER_TEMP/sim-eat
          AEGIS_EAT_COSE=0 sdk/examples/simulated-device/run.sh

      - name: Host regression (unit tests, red team, RTL simulation, ACVP)
        run: tools/regression.sh

      - name: The soak runner on a canned gateway, a simulated day healthy and with faults (docs/soak-and-watchdogs.md)
        run: .venv/bin/python tools/soak.py selftest

      - name: Standalone evidence checker on a pack the verifier exports (third-party libraries only; no skips)
        run: |
          .venv/bin/python -m unittest -v tests.host.test_evidence_format.Pack tests.host.test_sdk_eat > $RUNNER_TEMP/evidence.log 2>&1 || { cat $RUNNER_TEMP/evidence.log; exit 1; }
          tail -n 4 $RUNNER_TEMP/evidence.log
          if grep -q skipped $RUNNER_TEMP/evidence.log; then echo "a test of the standalone checker was skipped"; exit 1; fi

      - name: Standalone checker of the audit log and of a signed policy (third-party libraries only; no skips)
        run: |
          .venv/bin/python -m unittest -v tests.host.test_audit_policy.Checker > $RUNNER_TEMP/audit.log 2>&1 || { cat $RUNNER_TEMP/audit.log; exit 1; }
          tail -n 4 $RUNNER_TEMP/audit.log
          if grep -q skipped $RUNNER_TEMP/audit.log; then echo "a test of the standalone checker was skipped"; exit 1; fi

      - name: Audit-log anchors kept off the gateway (tools/audit_anchors.py; selftest and hostile input; no skips)
        run: |
          .venv/bin/python tools/audit_anchors.py --selftest
          .venv/bin/python -m unittest -v tests.host.test_audit_anchors > $RUNNER_TEMP/anchors.log 2>&1 || { cat $RUNNER_TEMP/anchors.log; exit 1; }
          tail -n 4 $RUNNER_TEMP/anchors.log
          if grep -q skipped $RUNNER_TEMP/anchors.log; then echo "a test of the anchor collector was skipped"; exit 1; fi

      - name: Enforcement ruleset (three network namespaces, real hook and ruleset)
        run: sudo tests/host/test_enforcement.sh

      - name: Enforcement over a VLAN switch (a VLAN-filtering bridge, vlan-setup.sh and the ruleset unchanged)
        run: sudo tests/host/test_enforcement_vlan.sh

      - name: Accelerator v2 SHA-3 provider on the register model (liboqs tests, KATs, NIST ACVP)
        run: tests/host/test_sponge_provider.sh

      - name: Diagrams are up to date
        run: .venv/bin/python tools/gen_diagrams.py --check

  container:
    # the evaluation container (container/README.md): built from its pinned inputs, then every stage without network
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build the evaluation image
        run: docker build -f container/Dockerfile --build-arg REVISION=$GITHUB_SHA -t aegis-eval .

      - name: Every stage, with no network
        run: |
          mkdir -p container/out && chmod 777 container/out
          docker run --rm --network none -v "$PWD/container/out:/out" -e AEGIS_EVAL_OUT=/out aegis-eval all \
            || { tail -n 40 container/out/*.log; exit 1; }
