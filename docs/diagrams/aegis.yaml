# Flow diagrams and annotated screenshots of the Aegis documentation. tools/gen_diagrams.py turns every *.yaml here into SVG.
# console.yaml is generated by tools/make_console_figures.py from evidence/; wave-keccak.yaml by hw/tb/make_wave.sh.

- id: system-overview
  alt: "The Aegis system. A PC checks the gateway's own quote. On the PolarFire gateway, aegisd serves the quote and reads the system controller, and aegis-fleet attests the endpoints; a fabric accelerator runs the SHA-3 sponge for liboqs when enabled. Four endpoints answer over Ethernet and are admitted: an NXP FRDM-RW612 with TF-M and its key from ELS in a TrustZone secure partition; two STM32H573I-DK with TF-M and a key from the DHUK; and a Zynq UltraScale+ (XCZU4EG) with the Aegis trusted application in OP-TEE and its key bound to the chip's PUF. The Arduino Uno, reached through a PC relay, cannot attest and is quarantined."
  width: 900
  height: 430
  nodes:
    pc:     {x: 20,  y: 30,  w: 230, h: 66, kind: start,  title: "PC", sub: "aegis_verify.py\nregression and demo"}
    aegisd: {x: 320, y: 30,  w: 250, h: 66, kind: hart,   title: "aegisd", sub: "gateway quote, ML-DSA-65\nTCP 7443"}
    sys:    {x: 640, y: 30,  w: 240, h: 66, kind: mss,    title: "System controller", sub: "device certificate, digests\nnonce, design info"}
    fleet:  {x: 320, y: 170, w: 250, h: 66, kind: hart,   title: "aegis-fleet", sub: "attest, admit, quarantine\nML-KEM credentials"}
    fab:    {x: 20,  y: 170, w: 230, h: 66, kind: fabric, title: "Fabric accelerator", sub: "SHA-3 sponge and NTT, slot 14\n1.2-1.5x faster in liboqs"}
    rw:     {x: 20,  y: 310, w: 200, h: 84, kind: sw,     title: "NXP FRDM-RW612", sub: "TF-M, TrustZone partition\nkey from ELS (die key)\ntrustzone trust"}
    stm:    {x: 240, y: 310, w: 200, h: 84, kind: sw,     title: "STM32H573I-DK x2", sub: "TF-M v2.3.0 + PQ partition\nDHUK-derived ML-DSA-65 key\nTCP 7444 over Ethernet"}
    zynq:   {x: 460, y: 310, w: 200, h: 84, kind: sw,     title: "Zynq UltraScale+", sub: "XCZU4EG, OP-TEE 4.7\nAegis TA, key from the PUF\ntrustzone trust"}
    uno:    {x: 680, y: 310, w: 200, h: 84, kind: bad,    title: "Arduino Uno", sub: "no keys, no measured boot\nreached through a PC relay\nTCP 7445"}
  edges:
    - {from: pc.right,     to: aegisd.left, label: "quote"}
    - {from: aegisd.right, to: sys.left,    label: "reads"}
    - {from: fleet.left,   to: fab.right,   label: "SHA-3", dashed: true}
    - {from: fleet.bottom@0.08, to: rw.top}
    - {from: fleet.bottom@0.08, to: stm.top,    label: "PQCHAL / PQTOKEN"}
    - {from: fleet.bottom@0.96, to: zynq.top}
    - {from: fleet.right,  to: uno.top,     label: "asks for a token"}
  steps: [pc, e0, aegisd, e1, sys, fleet, e2, fab, e3, rw, e4, stm, e5, zynq, e6, uno]

- id: decision-cycle
  alt: "One decision cycle. The gateway sends a fresh challenge. The endpoint returns a TF-M token with an ML-DSA-65 signature. The gateway checks the signature, the challenge and the measurements against its policy. A failure is QUARANTINED with the reason; a pass is ADMITTED, followed by an ML-KEM exchange that gives a credential and a session, with heartbeats until the next cycle."
  width: 900
  height: 340
  nodes:
    c1:  {x: 20,  y: 30,  w: 190, h: 66, kind: hart,  title: "1 Challenge", sub: "32 fresh random bytes\nPQCHAL"}
    c2:  {x: 250, y: 30,  w: 200, h: 66, kind: sw,    title: "2 Evidence", sub: "TF-M token (515 bytes)\n+ ML-DSA-65 signature"}
    c3:  {x: 490, y: 30,  w: 190, h: 66, kind: hart,  title: "3 Checks", sub: "signature, challenge,\nmeasurements vs policy"}
    ok:  {x: 720, y: 10,  w: 160, h: 56, kind: good,  title: "ADMITTED"}
    bad: {x: 720, y: 90,  w: 160, h: 56, kind: bad,   title: "QUARANTINED", sub: "reason logged"}
    c4:  {x: 490, y: 200, w: 190, h: 84, kind: hart,  title: "4 ML-KEM exchange", sub: "credential signed by the\ngateway, bound to the\nciphertext"}
    c5:  {x: 250, y: 200, w: 200, h: 84, kind: sw,    title: "5 Session", sub: "key held in secure RAM\nheartbeat every cycle"}
    c6:  {x: 20,  y: 200, w: 190, h: 84, kind: plain, title: "6 Next cycle", sub: "30 s later, or a new\nsession after a reboot"}
  edges:
    - {from: c1.right, to: c2.left}
    - {from: c2.right, to: c3.left}
    - {from: c3.right@0.3, to: ok.left}
    - {from: c3.right@0.8, to: bad.left}
    - {from: c3.bottom, to: c4.top, label: "if admitted"}
    - {from: c4.left, to: c5.right}
    - {from: c5.left, to: c6.right}
  steps: [c1, e0, c2, e1, c3, e2, ok, e3, bad, e4, c4, e5, c5, e6, c6]

- id: key-derivation
  alt: "How the endpoint's keys are made. The hardware-unique key, which software cannot read, is used by the SAES peripheral to AES-encrypt a fixed 32-byte label; the result is a seed, wiped after use, for the ML-DSA-65 key that signs quotes. A second secret from the same hardware key, with the gateway's nonce and a counter, seeds a fresh ML-KEM-768 key pair for each exchange, which yields the session key held in secure RAM."
  width: 900
  height: 330
  nodes:
    dhuk: {x: 20,  y: 140, w: 190, h: 66, kind: mem,   title: "Hardware-unique key", sub: "DHUK, not readable\nby software"}
    saes: {x: 260, y: 40,  w: 200, h: 66, kind: hart,  title: "SAES, AES-256", sub: "encrypts a fixed\n32-byte label"}
    seed: {x: 510, y: 40,  w: 170, h: 66, kind: plain, title: "Seed", sub: "wiped after key\ngeneration"}
    dsa:  {x: 720, y: 40,  w: 160, h: 66, kind: good,  title: "ML-DSA-65 key", sub: "signs the quotes"}
    root: {x: 260, y: 230, w: 200, h: 66, kind: hart,  title: "Second secret", sub: "prov_root, also from\nthe DHUK"}
    kem:  {x: 510, y: 230, w: 170, h: 66, kind: plain, title: "ML-KEM-768 pair", sub: "fresh per exchange\nnonce + counter"}
    sess: {x: 720, y: 230, w: 160, h: 66, kind: good,  title: "Session key", sub: "decapsulated, kept in\nsecure RAM only"}
  edges:
    - {from: dhuk.right@0.3, to: saes.left}
    - {from: saes.right, to: seed.left}
    - {from: seed.right, to: dsa.left}
    - {from: dhuk.right@0.7, to: root.left}
    - {from: root.right, to: kem.left}
    - {from: kem.right, to: sess.left}
  steps: [dhuk, e0, saes, e1, seed, e2, dsa, e3, root, e4, kem, e5, sess]

- id: tamper-detection
  alt: "How modified firmware is caught. An image signed with the trusted development key passes the boot loader's signature check and boots. The boot loader measures it, the token carries the measurement to the gateway, and the gateway finds a hash that its policy does not allow: the endpoint is quarantined and its credential revoked."
  width: 900
  height: 290
  nodes:
    t1: {x: 20,  y: 40,  w: 190, h: 66, kind: bad,  title: "Modified image", sub: "signed with the trusted\ndevelopment key"}
    t2: {x: 250, y: 40,  w: 190, h: 66, kind: hart, title: "BL2 verifies", sub: "signature valid,\nthe image boots"}
    t3: {x: 480, y: 40,  w: 190, h: 66, kind: hart, title: "BL2 measures", sub: "SHA-256 of the image,\nsigner id"}
    t4: {x: 710, y: 40,  w: 170, h: 66, kind: sw,   title: "Token", sub: "carries the\nmeasurement"}
    t5: {x: 480, y: 180, w: 190, h: 66, kind: hart, title: "Gateway policy", sub: "the allowed hash is\ndifferent"}
    t6: {x: 250, y: 180, w: 190, h: 66, kind: bad,  title: "QUARANTINED", sub: "credential revoked"}
  edges:
    - {from: t1.right, to: t2.left}
    - {from: t2.right, to: t3.left}
    - {from: t3.right, to: t4.left}
    - {from: t4.bottom, to: t5.right}
    - {from: t5.left, to: t6.right}
  steps: [t1, e0, t2, e1, t3, e2, t4, e3, t5, e4, t6]

- id: libero-canvas-annotated
  type: annotated
  image: docs/figures/libero-aegis-canvas-zoom.png
  alt: "The Libero top-level canvas zoomed in. The aegis_pqc_0 block with its clock, reset and APB target sits below FIC_0_PERIPHERALS_0; FIC_3_PERIPHERALS_0 holds the APB peripherals and address decoding; MSS_WRAPPER_0 is the processor subsystem."
  width: 900
  height: 459
  callouts:
    - {box: [575, 442, 100, 72],  title: "aegis_pqc_0", text: "The accelerator: clock, reset and one APB target, in slot 14."}
    - {box: [165, 205, 155, 335], title: "FIC_3_PERIPHERALS_0", text: "APB address decoding and the project's registers."}
    - {box: [585, 322, 145, 100], title: "FIC_0_PERIPHERALS_0", text: "The DMA path from the pfdaq project, unchanged."}
    - {box: [850, 0, 170, 455],   title: "MSS_WRAPPER_0", text: "The processor subsystem: the RISC-V cores, DDR and Ethernet."}

- id: libero-hierarchy-annotated
  type: annotated
  image: docs/figures/libero-aegis-hierarchy.png
  alt: "The Libero design hierarchy. aegis_pqc is a user block with two children: aegis_keccak, with its round function, and aegis_ntt, with the modular multiplier, twiddle ROM and dual-port RAM."
  width: 560
  height: 747
  callouts:
    - {box: [100, 322, 190, 20], title: "aegis_pqc", text: "One block on the APB bus holding both engines."}
    - {box: [118, 342, 215, 38], title: "Keccak", text: "One round per clock: 24 clocks per permutation."}
    - {box: [118, 380, 215, 76], title: "NTT", text: "Modular multiplier, twiddle ROM and RAM; one butterfly per clock."}
    - {box: [60, 285, 150, 20],  title: "Vendor blocks", text: "MSS_WRAPPER and the reference design's peripherals sit beside it."}

- id: enforcement-path
  alt: "The enforcement path. Traffic from an endpoint reaches the gateway's forward chain, whose policy is drop. It is forwarded to the rest of the network only while the endpoint's address is in the admitted set, in either direction; otherwise it is dropped and logged. After every verdict, aegis-fleet calls the hook that adds the address to the set or removes it, and the gateway keeps attesting the endpoint directly."
  width: 900
  height: 410
  nodes:
    ep:    {x: 20,  y: 110, w: 200, h: 76, kind: sw,    title: "Endpoint", sub: "attested every cycle\nby the gateway"}
    gw:    {x: 300, y: 80,  w: 300, h: 136, kind: hart, title: "Gateway forward chain", sub: "policy drop\nsource in @admitted: accept\ndestination in @admitted: accept\nanything else: drop and log"}
    lan:   {x: 680, y: 110, w: 200, h: 76, kind: plain, title: "The rest of the network"}
    fleet: {x: 300, y: 300, w: 300, h: 76, kind: hart,  title: "aegis-fleet", sub: "after every verdict calls\naegis-enforce.sh admit | quarantine"}
  edges:
    - {from: ep.right,   to: gw.left,    label: "traffic"}
    - {from: gw.right,   to: lan.left,   label: "if admitted"}
    - {from: fleet.top,  to: gw.bottom,  label: "set the address"}
    - {from: fleet.left, to: ep.bottom,  label: "attests", dashed: true}
  steps: [ep, e0, gw, e1, lan, fleet, e2, e3]

- id: enforcement-vlan
  alt: "One gateway port and a VLAN switch, as tested in network namespaces. The endpoint ports are untagged members of VLAN 20 only; the router's port is on VLAN 1; the gateway's single port carries VLAN 1 untagged and VLAN 20 tagged. The gateway has a VLAN interface for VLAN 20, routes and masquerades between it and the LAN, and enforces the ruleset on it. An endpoint reaches the LAN only through the gateway, and only while admitted; a LAN address or self-tagged frames on an endpoint get nowhere."
  width: 900
  height: 440
  nodes:
    ep:   {x: 20,  y: 40,  w: 220, h: 76, kind: sw,    title: "Endpoints", sub: "STM32, RW612, ...\n10.20.0.x"}
    sw:   {x: 330, y: 40,  w: 240, h: 136, kind: plain, title: "Switch (802.1Q)", sub: "endpoint ports: VLAN 20,\nuntagged, only\ngateway port: VLAN 1 untagged\n+ VLAN 20 tagged"}
    lan:  {x: 660, y: 40,  w: 220, h: 76, kind: plain, title: "Router, PC", sub: "VLAN 1, the LAN"}
    gw:   {x: 330, y: 260, w: 240, h: 120, kind: hart,  title: "Gateway (one port)", sub: "end0: LAN\nend0.20: endpoint VLAN\nroutes, masquerades,\naegis.nft on end0.20"}
    blk:  {x: 20,  y: 260, w: 220, h: 120, kind: bad,   title: "Blocked at the switch", sub: "a LAN address on an\nendpoint; frames tagged\nfor VLAN 1; LAN to\nendpoint directly"}
    thru: {x: 660, y: 260, w: 220, h: 120, kind: good,  title: "Through the gateway", sub: "admitted: to the LAN\nquarantined: only the\nquote port; attestation\nalways"}
  edges:
    - {from: ep.right,   to: sw.left,    label: "VLAN 20"}
    - {from: sw.right,   to: lan.left,   label: "VLAN 1"}
    - {from: sw.bottom,  to: gw.top,     label: "trunk"}
    - {from: gw.right,   to: thru.left}
    - {from: blk.right,  to: gw.left,    dashed: true}
  steps: [ep, e0, sw, e1, lan, e2, gw, e3, thru, blk, e4]
