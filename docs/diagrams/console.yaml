- id: console-hardening-journal
  type: terminal
  title: the gateway journal while the endpoint was hardened
  alt: 'The gateway journal during the deployment of hedged signing and KMAC heartbeats: the old image stays admitted under the new gateway code;
    the new image is quarantined because its measurement is not yet in the policy; after the policy is updated it is admitted with a new session
    and its KMAC256 heartbeats verify. Copied from the terminal output of the session; the gateway journal itself is not kept across reboots.'
  width: 940
  step: 3.4
  height: 284
  lines:
  - '$ ssh <gateway> journalctl -u aegis-fleet -o cat      # during the deployment, 17 November 2026'
  - '17:13:05 stm32h573-dk ADMITTED  [credential: valid, heartbeat 2 (uptime_s=60;link=1;fw=0.4.0)]'
  - '17:13:35 stm32h573-dk ADMITTED  [credential: valid, heartbeat 3 (uptime_s=91;link=1;fw=0.4.0)]'
  - '17:14:25 stm32h573-dk QUARANTINED component SPE not allowed (measurement a5997cc3c61a...) [credential: revoked]'
  - '17:14:30 stm32h573-dk ADMITTED  [credential: issued session cd1126078134...]'
  - '17:15:01 stm32h573-dk ADMITTED  [credential: valid, heartbeat 1 (uptime_s=53;link=1;fw=0.4.0)]'
  - '17:15:31 stm32h573-dk ADMITTED  [credential: valid, heartbeat 2 (uptime_s=83;link=1;fw=0.4.0)]'
  callouts:
  - lines:
    - 1
    - 2
    title: New gateway code, old image
    text: 'Still admitted: without a policy change the gateway keeps the first heartbeat.'
  - lines:
    - 3
    - 3
    title: New image, old policy
    text: An image the policy does not know is refused at once and its credential revoked.
  - lines:
    - 4
    - 4
    title: Policy updated
    text: 'The new measurement is allowed: admitted with a new session.'
  - lines:
    - 5
    - 6
    title: KMAC256 heartbeats
    text: The heartbeat tag is now KMAC256, and it verifies every cycle.
- id: console-quote-variation
  type: terminal
  title: two quotes for the same challenge
  alt: 'Two quotes requested with the same challenge: both ML-DSA-65 signatures verify with the pinned key and they differ, but the PSA token
    inside also differs, because TF-M signs it with randomized ECDSA, so this does not show hedged signing.'
  width: 900
  step: 3.4
  height: 264
  lines:
  - $ tools/board/hedged_quotes.py <stm32> 7444 stm32h573-dk.mldsa65.pub
  - challenge 8d4798850ac6d50b7e23c42e... (the same for both requests)
  - 'quote 1: ML-DSA-65 signature 3309 bytes sha256 675abb721623a04d, verifies with the pinned key: True'
  - 'quote 2: ML-DSA-65 signature 3309 bytes sha256 7a921a7c683e4cf2, verifies with the pinned key: True'
  - 'PSA token payload (the claims) equal: True; TF-M''s ECDSA signature equal: False'
  - so the signed message differs per request, and different ML-DSA signatures do not by themselves show hedging
  callouts:
  - lines:
    - 2
    - 3
    title: Both valid, both different
    text: Two ML-DSA-65 signatures for one challenge, each checked as the gateway does.
  - lines:
    - 4
    - 4
    title: The token changed too
    text: 'Same claims, but TF-M''s own ECDSA signature differs: the signed message is not the same.'
  - lines:
    - 5
    - 5
    title: What it shows
    text: Not hedging. That is shown on the PC with the partition code signing one message twice.
- id: console-two-boards
  type: terminal
  title: two chips with the same firmware
  alt: 'Two STM32H573 boards with identical firmware, option bytes and boot loader: their ML-DSA-65 keys differ, their PSA identity is the same,
    and the second board is refused when it presents itself under the first board''s name.'
  width: 900
  step: 3.4
  height: 384
  lines:
  - $ PQKEY and CHAL on both boards; fleet.py once with each pinned key
  - board 1 (networked endpoint), ST-LINK 003D002F...
  - '  Aegis ML-DSA-65 public key (PQKEY): 1952 bytes, sha256 29b953e6571dbd36...'
  - '  PSA token, same challenge 89020f0b...: instance ID 01078c18f110f432ff780cd8dae58069...'
  - '  PSA implementation ID a0a1a2a3a4a5a6a7a8a9aaabacadaeaf...'
  - board 2 (second chip), ST-LINK 002E0039...
  - '  Aegis ML-DSA-65 public key (PQKEY): 1952 bytes, sha256 c9e2aa6e8157ac94...'
  - '  PSA token, same challenge 89020f0b...: instance ID 01078c18f110f432ff780cd8dae58069...'
  - '  PSA implementation ID a0a1a2a3a4a5a6a7a8a9aaabacadaeaf...'
  - 'ML-DSA keys: different; 1941 of 1952 bytes differ'
  - 'board 2 under board 1''s name (board 1''s pinned key): admitted False, ML-DSA-65 quote signature invalid'
  - 'board 2 with its own pinned key: admitted True'
  callouts:
  - lines:
    - 1
    - 4
    title: Board 1
    text: Its ML-DSA key, and the PSA identity from TF-M's development provisioning.
  - lines:
    - 5
    - 8
    title: Board 2
    text: A different ML-DSA key; exactly the same PSA instance and implementation IDs.
  - lines:
    - 9
    - 9
    title: Keys
    text: '1,941 of 1,952 bytes differ: the key comes from the chip.'
  - lines:
    - 10
    - 11
    title: Impersonation
    text: Under board 1's name board 2 is refused; under its own key it is admitted.
