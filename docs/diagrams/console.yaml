- id: console-rw612-tz-boot
  type: terminal
  title: the FRDM-RW612 starting TF-M and the Aegis partition
  alt: 'The board console after a reset with TrustZone: TF-M boots, the Aegis partition measures both flash partitions before any non-secure code
    runs, the non-secure prover starts, the partition derives its key in ELS at the first request, and the network comes up with the MAC address
    taken from that key.'
  width: 980
  step: 3.4
  height: 344
  lines:
  - $ board console (USB serial), after a reset
  - Booting TF-M v2.1.4
  - '[Aegis] partitions measured (SPE, NSPE); the key is made at the first request'
  - Creating an empty ITS flash layout.
  - '[INF][PS] Encryption alg: 0x5500100'
  - AEGIS-RW612-TFM-PROVER 0.2.0 (non-secure network side; the key and the proofs are in the secure partition)
  - '[Aegis] key from ELS: rc=0'
  - 'aegis: mac  2:ae:dd:dd:6b:a1'
  - Initializing PHY...
  - 'aegis: address <lan address>, listening on 7444'
  callouts:
  - lines:
    - 1
    - 1
    title: TF-M
    text: NXP's TF-M v2.1.4 boots the secure image.
  - lines:
    - 2
    - 2
    title: Measured first
    text: SPE and NSPE are hashed before the non-secure image runs.
  - lines:
    - 5
    - 6
    title: Non-secure prover, key
    text: The network side starts; its first request makes the partition derive the key in ELS.
  - lines:
    - 7
    - 9
    title: On the network
    text: MAC from the key (the console drops the leading 0), PHY up, DHCP, port 7444.
- id: console-rw612-tz-probes
  type: terminal
  title: non-secure reads of protected peripherals
  alt: 'A test build of the non-secure prover reads one register of a peripheral at start-up. Under NXP rules the fuse controller and FlexSPI
    read fine. Under the Aegis rules every protected block faults: the chip restarts and the read never returns. The ENET register the prover
    needs still reads.'
  width: 900
  step: 3.4
  height: 464
  lines:
  - '$ endpoints/rw612/tfm/probe.sh <out> NAME=0xADDR ...   # summarised from the console of each run'
  - 'NXP rules:   OCOTP          read-ok=1  aegis-probe: read ok, value 0x    2000'
  - 'NXP rules:   FLEXSPI        read-ok=1  aegis-probe: read ok, value 0xffff8010'
  - 'Aegis rules: OCOTP          boots=7 probe-attempts=6 read-ok=0'
  - 'Aegis rules: FLEXSPI        boots=7 probe-attempts=6 read-ok=0'
  - 'Aegis rules: CACHE64_CTRL0  boots=8 probe-attempts=7 read-ok=0'
  - 'Aegis rules: TRNG           boots=8 probe-attempts=7 read-ok=0'
  - 'Aegis rules: RSTCTL0        boots=3 probe-attempts=2 read-ok=0'
  - 'Aegis rules: CLKCTL0        boots=7 probe-attempts=6 read-ok=0'
  - 'Aegis rules: SYSCTL0        boots=7 probe-attempts=6 read-ok=0'
  - 'Aegis rules: MCI_IO_MUX     boots=3 probe-attempts=2 read-ok=0'
  - 'Aegis rules: SOCCTRL        boots=7 probe-attempts=6 read-ok=0'
  - 'Aegis rules: SOC_OTP_CTRL   boots=7 probe-attempts=6 read-ok=0'
  - 'Aegis rules: PMU            boots=7 probe-attempts=6 read-ok=0'
  - 'Aegis rules: SYSCTL2        boots=7 probe-attempts=6 read-ok=0'
  - 'Aegis rules: ENET_EIR       boots=1 probe-attempts=1 read-ok=1'
  callouts:
  - lines:
    - 1
    - 2
    title: NXP rules
    text: Non-secure code reads the fuse controller and the flash controller.
  - lines:
    - 3
    - 6
    title: Aegis rules
    text: 'Fuses, flash controller, flash cache and TRNG: a fault on every attempt.'
  - lines:
    - 7
    - 9
    title: Reset, clock, system
    text: 'They hold the ELS reset and clock: secure only.'
  - lines:
    - 10
    - 14
    title: After the review
    text: The pin mux, SOC_TOP (with the SoC OTP controller), PMU and SYSCTL2 too.
  - lines:
    - 15
    - 15
    title: Control
    text: The ENET register the prover needs still reads.
- id: console-rw612-tz-gateway
  type: terminal
  title: 'the gateway journal: TrustZone, a modified non-secure image, and back'
  alt: 'The gateway journal for the RW612 with TrustZone: admitted with trustzone trust, a credential issued through the secure partition and
    KMAC heartbeats; with a non-secure image changed by one byte, quarantined because the NSPE measurement is not allowed, credential revoked;
    with the good image back, admitted with a new session.'
  width: 1100
  step: 3.4
  height: 364
  lines:
  - $ ssh <gateway> journalctl -u aegis-fleet -o cat | grep frdm-rw612
  - '06:33:52 frdm-rw612 ADMITTED (trustzone trust)  [credential: issued session f5ba87c14aa9...]'
  - '06:34:26 frdm-rw612 ADMITTED (trustzone trust)  [credential: valid, heartbeat 1 (requests=10;fw=rw612-tfm-0.2.0)]'
  - '06:35:00 frdm-rw612 ADMITTED (trustzone trust)  [credential: valid, heartbeat 2 (requests=12;fw=rw612-tfm-0.2.0)]'
  - '06:35:48 frdm-rw612 QUARANTINED no attestation: [Errno 113] No route to host [credential: revoked]'
  - '06:36:21 frdm-rw612 QUARANTINED (trustzone trust) component NSPE not allowed (measurement dea2a3b37159...) [credential: revoked]'
  - '06:36:55 frdm-rw612 QUARANTINED (trustzone trust) component NSPE not allowed (measurement dea2a3b37159...) [credential: revoked]'
  - '06:37:43 frdm-rw612 QUARANTINED no attestation: [Errno 113] No route to host [credential: revoked]'
  - '06:38:17 frdm-rw612 ADMITTED (trustzone trust)  [credential: issued session 0a3caec39a2c...]'
  - '06:38:50 frdm-rw612 ADMITTED (trustzone trust)  [credential: valid, heartbeat 1 (requests=6;fw=rw612-tfm-0.2.0)]'
  - '06:39:24 frdm-rw612 ADMITTED (trustzone trust)  [credential: valid, heartbeat 2 (requests=8;fw=rw612-tfm-0.2.0)]'
  callouts:
  - lines:
    - 1
    - 3
    title: TrustZone admitted
    text: A credential through the secure partition, then heartbeats.
  - lines:
    - 4
    - 6
    title: Modified non-secure image
    text: 'Unreachable while it is flashed, then NSPE not allowed: credential revoked.'
  - lines:
    - 7
    - 10
    title: Good image back
    text: Flashed again, then admitted with a new session and heartbeats.
- id: console-rw612-fuzz
  type: terminal
  title: fuzzing the partition's protocol code
  alt: 'The fuzz runs on the PC. On the reviewed code, every worker stopped within seconds: a refused PQKEMINIT had left the older exchange pending
    with the wrong key in it. After the fix, eight workers ran for 30 minutes each: about a million executions with the sanitizers on, and no
    crash, sanitizer report or disagreement with the model.'
  width: 980
  step: 3.4
  height: 424
  lines:
  - '$ tests/fuzz/run.sh 60 4        # aegis_proto.c as reviewed (0.2.0)'
  - 'ORACLE: PQKEMFIN without an exchange: ERR cred other-key'
  - '$ tests/fuzz/run.sh 1800 8      # 0.2.1, the fix'
  - '#126326 DONE   cov: 317 ft: 1351 corp: 332/34Kb'
  - '#153781 DONE   cov: 317 ft: 1351 corp: 331/34Kb'
  - '#101385 DONE   cov: 317 ft: 1350 corp: 334/36Kb'
  - '#138015 DONE   cov: 317 ft: 1351 corp: 332/34Kb'
  - '#104632 DONE   cov: 317 ft: 1350 corp: 333/35Kb'
  - '#148827 DONE   cov: 317 ft: 1351 corp: 336/34Kb'
  - '#149758 DONE   cov: 317 ft: 1350 corp: 333/34Kb'
  - '#126791 DONE   cov: 317 ft: 1350 corp: 335/35Kb'
  - 'total executions: 1049515; crashes, sanitizer reports, oracle failures, timeouts, out-of-memory: 0'
  - $ tests/fuzz/coverage.sh <corpus>
  - 'aegis_proto.c: functions 100.00 %, lines 94.68 %, branches 89.76 %'
  callouts:
  - lines:
    - 1
    - 1
    title: Before the fix
    text: The model expected no pending exchange; the device still had one.
  - lines:
    - 3
    - 10
    title: 8 workers, 30 min
    text: Executions per worker, coverage and corpus size.
  - lines:
    - 11
    - 11
    title: Result
    text: About a million executions, nothing found.
  - lines:
    - 13
    - 13
    title: Reached
    text: The 20 missed lines are listed in the evidence, each with its reason.
- id: console-enforcement-reply-bug
  type: terminal
  title: the ruleset that let no endpoint in
  alt: 'tests/host/test_enforcement.sh with two new checks: can the gateway reach the endpoint it must attest? With the ruleset as it was, no:
    the input chain dropped the replies to the gateway''s own connections. With the reply rule, yes, and the endpoint still cannot open other
    gateway ports.'
  width: 1000
  step: 3.4
  height: 424
  lines:
  - '$ sudo tests/host/test_enforcement.sh      # the ruleset of 17 November'
  - PASS TCP to the gateway quote port (allow)
  - FAIL the gateway reaches the endpoint's prover (attestation) (wanted allow, got block)
  - PASS TCP to the gateway quote port (allow)
  - FAIL the gateway still attests the quarantined endpoint (wanted allow, got block)
  - PASS the endpoint reaches another gateway port (SSH) (block)
  - passed 11, failed 2
  - '$ sudo tests/host/test_enforcement.sh      # with "ct direction reply accept"'
  - PASS TCP to the gateway quote port (allow)
  - PASS the gateway reaches the endpoint's prover (attestation) (allow)
  - PASS TCP to the gateway quote port (allow)
  - PASS the gateway still attests the quarantined endpoint (allow)
  - PASS the endpoint reaches another gateway port (SSH) (block)
  - passed 13, failed 0
  callouts:
  - lines:
    - 1
    - 5
    title: Before
    text: 'The gateway cannot attest an endpoint that is not admitted: nobody is ever let in.'
  - lines:
    - 6
    - 6
    title: Before
    text: 11 passed, 2 failed.
  - lines:
    - 8
    - 13
    title: After
    text: Attestation works both ways; other gateway ports stay closed.
- id: console-enforcement-vlan
  type: terminal
  title: one gateway port and a VLAN switch, in network namespaces
  alt: 'tests/host/test_enforcement_vlan.sh: a VLAN-filtering bridge plays the switch, vlan-setup.sh and the ruleset run unchanged in the gateway
    namespace. It checks admission and quarantine, the ways around a VLAN, and two known limits, which behave as stated.'
  width: 1000
  step: 3.4
  height: 664
  lines:
  - $ sudo tests/host/test_enforcement_vlan.sh
  - -- an endpoint that has not attested
  - PASS ping the LAN (block)
  - PASS TCP to the LAN (block)
  - PASS TCP to the gateway quote port (allow)
  - PASS the gateway attests it over the VLAN (allow)
  - -- admitted
  - PASS ping the LAN (masqueraded by the gateway) (allow)
  - PASS TCP to the LAN (allow)
  - PASS the other, unattested endpoint still cannot (block)
  - -- quarantined
  - PASS TCP to the LAN (block)
  - PASS the gateway still attests it (allow)
  - -- ways around the VLAN
  - 'PASS a LAN address on the endpoint: the LAN host directly (block)'
  - PASS frames tagged for the LAN's VLAN 1 (block)
  - PASS a LAN host reaches the endpoint directly (block)
  - '-- known limit (needs the switch''s port isolation): endpoints on the same VLAN see each other'
  - PASS endpoint to endpoint, past the gateway (allow)
  - '-- known limit (until the next cycle): a device that takes an admitted endpoint''s address'
  - PASS the unattested device, with the admitted address, to the LAN (allow)
  - '   (the gateway''s next cycle attests 10.20.0.2, gets no valid quote and quarantines it: see aegis-enforce.sh)'
  - PASS after that cycle's quarantine (block)
  - -- undo
  - PASS down removes the VLAN interface, the NAT table and the Aegis table
  - passed 16, failed 0
  callouts:
  - lines:
    - 1
    - 5
    title: Not attested
    text: Only the quote port; the gateway can attest it.
  - lines:
    - 6
    - 9
    title: Admitted
    text: To the LAN through the gateway; a second, unattested endpoint still cannot.
  - lines:
    - 10
    - 12
    title: Quarantined
    text: Cut off; still attested.
  - lines:
    - 13
    - 16
    title: Ways around
    text: 'A LAN address, self-tagged frames, LAN to endpoint: all blocked.'
  - lines:
    - 17
    - 22
    title: Known limits
    text: Same-VLAN endpoints see each other; a taken address passes until the next cycle.
  - lines:
    - 23
    - 25
    title: Undo
    text: Nothing is left behind.
