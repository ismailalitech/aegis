- id: console-demo-journal
  type: terminal
  title: gateway journal during the demo
  alt: 'The gateway journal during the scripted demo: an endpoint that did not answer is quarantined, then admitted with a new session and heartbeats,
    then quarantined when a modified image runs because its measurement is not allowed, and admitted again with a new session when the good image
    is back.'
  width: 900
  step: 3.4
  height: 324
  lines:
  - '$ ssh <gateway> journalctl -u aegis-fleet -o cat      # recorded during tools/demo.sh'
  - 'stm32h573-dk QUARANTINED no attestation: no PQ quote in reply: '''' [credential: revoked]'
  - 'stm32h573-dk ADMITTED  [credential: issued session 8c25e397e036...]'
  - 'stm32h573-dk ADMITTED  [credential: valid, heartbeat 1 (uptime_s=137;link=1;fw=0.4.0)]'
  - 'stm32h573-dk ADMITTED  [credential: valid, heartbeat 2 (uptime_s=168;link=1;fw=0.4.0)]'
  - 'stm32h573-dk ADMITTED  [credential: valid, heartbeat 3 (uptime_s=198;link=1;fw=0.4.0)]'
  - 'stm32h573-dk QUARANTINED component NSPE not allowed (measurement b89ee37e2add...) [credential: revoked]'
  - 'stm32h573-dk ADMITTED  [credential: issued session 9bb455c9acad...]'
  - 'stm32h573-dk ADMITTED  [credential: valid, heartbeat 1 (uptime_s=53;link=1;fw=0.4.0)]'
  callouts:
  - lines:
    - 1
    - 1
    title: No quote
    text: 'No post-quantum quote in the reply: quarantined, credential revoked.'
  - lines:
    - 2
    - 2
    title: Admitted, with a session
    text: The checks pass; an ML-KEM credential and a session are issued.
  - lines:
    - 3
    - 5
    title: Heartbeats
    text: Each cycle the endpoint proves it still holds the session; the counter rises.
  - lines:
    - 6
    - 6
    title: Modified firmware
    text: 'Signed and booting, but its measurement is not in the policy: quarantined, credential revoked.'
  - lines:
    - 7
    - 8
    title: Good image back
    text: Admitted again with a different session; the heartbeat counter starts over.
