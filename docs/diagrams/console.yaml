- id: console-latency
  type: terminal
  title: 'Linux interrupt latency: five setups'
  alt: 'Five setups of the Linux interrupt-latency measurement: the default, a pinned process at normal priority, a pinned real-time process on
    two cores, and the real-time process under full CPU load. Only the real-time rows have no overruns.'
  width: 900
  step: 3.6
  height: 364
  lines:
  - $ tools/board/latency_ab.sh ; tools/board/latency_load.sh
  - 'A_default_1 {"overrun": 24, "mean": 78.95, "p999": 163.82, "max": 4945.36}'
  - 'A_default_2 {"overrun": 37, "mean": 81.15, "p999": 163.82, "max": 3594.92}'
  - 'B_cpu2_pinned_1 {"overrun": 64, "mean": 61.85, "p999": 122.86, "max": 4704.78}'
  - 'B_cpu2_pinned_2 {"overrun": 152, "mean": 62.14, "p999": 122.86, "max": 5104.74}'
  - 'C_cpu2_fifo80_1 {"overrun": 0, "mean": 53.82, "p999": 122.86, "max": 446.5}'
  - 'C_cpu2_fifo80_2 {"overrun": 0, "mean": 53.64, "p999": 122.86, "max": 412.66}'
  - 'D_cpu1_fifo80_1 {"overrun": 0, "mean": 53.62, "p999": 122.86, "max": 359.32}'
  - 'D_cpu1_fifo80_2 {"overrun": 0, "mean": 53.59, "p999": 81.9, "max": 469.4}'
  - 'LOAD_C_cpu2_fifo80_1 {"overrun": 3, "mean": 51.55, "p999": 122.86, "max": 1472.78}'
  - 'LOAD_C_cpu2_fifo80_2 {"overrun": 0, "mean": 51.24, "p999": 122.86, "max": 407.82}'
  callouts:
  - lines:
    - 1
    - 2
    title: Default
    text: 'Maximum 3.6 to 4.9 ms and dozens of overruns: scheduling, one tick at 250 Hz is 4 ms.'
  - lines:
    - 3
    - 4
    title: Pinned, normal priority
    text: Moving the interrupt and task to another core does not help.
  - lines:
    - 5
    - 8
    title: Pinned, SCHED_FIFO 80
    text: No overruns and a maximum under half a millisecond, on CPU2 and on CPU1.
  - lines:
    - 9
    - 10
    title: Under load
    text: 'A busy loop on every core: 0 and 3 overruns; one run reached 1.47 ms. Not a hard bound.'
