  alt: Waveform from the RTL simulation of aegis_pqc2 squeezing one block by DMA. The CPU writes the SQUEEZE command; the
    sponge is busy for 24 clocks computing the permutation, then raises AWVALID for one burst and sends the 21 lanes of the
    block as 64-bit beats while the memory model holds WREADY low at random; WLAST marks the 21st beat and the write response
    follows.
