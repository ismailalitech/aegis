#   MACHINE=mpfs-disco-kit-amp bitbake -R <aegis-repo>/yocto/aegis-kernel.conf linux-mchp
FILESEXTRAPATHS:prepend:pn-linux-mchp := "<aegis-repo>/yocto/files:"
